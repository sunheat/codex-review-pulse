name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Record Git and LFS versions
        run: |
          git --version
          git lfs version

      - name: Run network-free tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q skills/codex-review-pulse/scripts scripts tests

      - name: Validate repository and CLI help
        run: python scripts/validate_repository.py

  configured-hooks:
    name: Git 2.54+ configuration-hook regression
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require configuration-hook capable Git
        shell: bash
        run: |
          git --version
          python -c "import re, subprocess; v = subprocess.check_output(['git', '--version'], text=True); assert tuple(map(int, re.search(r'(\d+)\.(\d+)', v).groups())) >= (2, 54), v"
      - name: Exercise real configuration hooks and common execution policy
        run: python -m unittest discover -s tests -p test_gitexec.py -v
