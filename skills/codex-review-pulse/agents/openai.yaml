interface:
  display_name: "Codex Review Pulse"
  short_description: "Bounded Codex PR remediation campaigns in the Codex app via native Automations: one-sentence launch, locked scheduled workers, in-memory remediation batches, one @codex review per head, fail-closed ambiguity."
  default_prompt: "Run Codex Review Pulse on a GitHub pull request for a bounded number of effective rounds, specifying the worker model, reasoning level, and delivery interval. The skill validates the target, creates the small campaign record, and configures one native Codex Automation; scheduled deliveries independently re-observe GitHub and Git, remediate applicable Codex review threads, and stop on approval, terminal policy, exhaustion, or fail-closed ambiguity. Discovery metadata does not authorize a live run."
